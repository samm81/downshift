name: build-windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install web tooling
        run: npm ci

      - name: cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --check

      - name: check Windows web tooling
        run: npm run check:windows

      - name: build Windows x64
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: run Rust tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: run Rust Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: build unsigned Windows installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\build-installer.ps1 -SkipBuild

      - name: run scripted installer smoke
        # Hosted Windows runners can create the WebView2 window but do not
        # provide a reliable composited WebView surface for app UI input.
        # Keep wizard/install/uninstall coverage here; full app UI smoke runs
        # locally and in the dedicated interactive VM.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\smoke-installer.ps1 -SkipInstalledGui

      - name: upload Windows installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-smoke
          path: |
            logs/installer-smoke-windows-*
            logs/gui-smoke-windows-*
            dist/windows/SHA256SUMS.txt
          if-no-files-found: warn
