name: basic-quality

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install Linux build and shell tooling
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends --yes
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          libssl-dev
          pkg-config
          shellcheck
          shfmt

      - name: install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: install web tooling
        run: npm ci

      - name: cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: check Rust formatting
        run: cargo fmt --check

      - name: run library and integration tests
        run: >-
          cargo test --locked --lib
          --test ipc_integration
          --test settings_integration
          --test telemetry_integration

      - name: run library and integration Clippy
        run: >-
          cargo clippy --locked --lib
          --test ipc_integration
          --test settings_integration
          --test telemetry_integration
          -- -D warnings

      - name: check web, shell, markdown, and Pages tooling
        run: npm run check
