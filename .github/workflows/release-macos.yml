name: release-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release (for example v0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    environment: release
    outputs:
      notarization_finished: ${{ steps.wait.outputs.finished }}
      release_tag: ${{ steps.release.outputs.tag }}
      submission_id: ${{ steps.submit.outputs.submission_id }}
    env:
      APP_NAME: Downshift
      DOWNSHIFT_ENV: ${{ vars.DOWNSHIFT_ENV }}
      DOWNSHIFT_DOWNLOAD_RELEASE_URL: ${{ vars.DOWNSHIFT_DOWNLOAD_RELEASE_URL }}
      DOWNSHIFT_GITHUB_ISSUES_URL: ${{ vars.DOWNSHIFT_GITHUB_ISSUES_URL }}
      DOWNSHIFT_SUPPORT_EMAIL: ${{ vars.DOWNSHIFT_SUPPORT_EMAIL }}
      DOWNSHIFT_TELEMETRY_ENABLED: ${{ vars.DOWNSHIFT_TELEMETRY_ENABLED }}
      DOWNSHIFT_TELEMETRY_HEARTBEAT_INTERVAL_SEC: ${{ vars.DOWNSHIFT_TELEMETRY_HEARTBEAT_INTERVAL_SEC }}
      DOWNSHIFT_BETTERSTACK_LOGS_TOKEN: ${{ secrets.DOWNSHIFT_BETTERSTACK_LOGS_TOKEN }}
      DOWNSHIFT_BETTERSTACK_LOGS_HOST: ${{ secrets.DOWNSHIFT_BETTERSTACK_LOGS_HOST }}
      DOWNSHIFT_BETTERSTACK_ERRORS_DSN: ${{ secrets.DOWNSHIFT_BETTERSTACK_ERRORS_DSN }}
      DOWNSHIFT_BUILD_CHANNEL: ${{ vars.DOWNSHIFT_BUILD_CHANNEL }}
      MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: resolve release tag
        id: release
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "error: release tag is required"
            exit 1
          fi
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "error: release tag must start with v"
              exit 1
              ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: install node dependencies
        run: |
          npm ci

      - name: install shell tooling
        run: |
          brew install shellcheck shfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: verify repo
        run: |
          make verify-release

      - name: build signed release assets
        run: |
          make release-pre-notarize TAG="${{ steps.release.outputs.tag }}"

      - name: submit notarization
        id: submit
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.release.outputs.tag }}"
          DMG_PATH="dist/${APP_NAME}-notarized-${RELEASE_TAG}.dmg"
          SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"
          SUBMISSION_FILE="dist/${APP_NAME}-notary-submission-id-${RELEASE_TAG}.txt"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --output-format json > "$SUBMIT_JSON"

          SUBMISSION_ID="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMIT_JSON")"
          if [ -z "$SUBMISSION_ID" ]; then
            echo "error: failed to read notarization submission id"
            exit 1
          fi

          printf '%s\n' "$SUBMISSION_ID" > "$SUBMISSION_FILE"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      - name: create or update draft release
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.release.outputs.tag }}"
          DMG_PATH="dist/${APP_NAME}-notarized-${RELEASE_TAG}.dmg"

          gh api "/repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" >/dev/null

          if RELEASE_ID="$(
            gh api --paginate "/repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" or .name == \"$RELEASE_TAG\") | .id" \
              | head -n 1
          )" && [ -n "$RELEASE_ID" ]; then
            gh api \
              -X PATCH \
              "/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -f tag_name="$RELEASE_TAG" \
              -F draft=true \
              -f name="$RELEASE_TAG" >/dev/null
          else
            gh api \
              -X POST \
              "/repos/${{ github.repository }}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$RELEASE_TAG" \
              -F draft=true \
              -F generate_release_notes=true >/dev/null
          fi

          gh release upload "$RELEASE_TAG" \
            "$DMG_PATH" \
            --clobber

      - name: collect workflow artifacts
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.release.outputs.tag }}"
          mkdir -p release-artifacts
          cp "dist/${APP_NAME}-notarized-${RELEASE_TAG}.dmg" release-artifacts/
          cp "dist/${APP_NAME}-notary-submission-id-${RELEASE_TAG}.txt" release-artifacts/

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: breath-ball-macos
          path: release-artifacts/*

      - name: wait for notarization up to 15 minutes
        id: wait
        run: |
          set -euo pipefail
          SUBMISSION_ID="${{ steps.submit.outputs.submission_id }}"
          STATUS_JSON="$RUNNER_TEMP/notary-status.json"
          FINISHED="false"

          set +e
          xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --timeout 15m \
            --output-format json > "$STATUS_JSON"
          WAIT_EXIT=$?
          set -e

          if [ "$WAIT_EXIT" -ne 0 ]; then
            xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --password "$MACOS_NOTARY_APP_PASSWORD" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --output-format json > "$STATUS_JSON"
          fi

          STATUS="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$STATUS_JSON")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          case "$STATUS" in
            Accepted)
              FINISHED="true"
              echo "notarization completed within the 15 minute wait window"
              ;;
            "In Progress"|Submitted)
              echo "notarization is still in progress after the 15 minute wait window; leaving the release as draft"
              ;;
            Invalid|Rejected)
              echo "error: notarization finished with status '$STATUS'"
              exit 1
              ;;
            *)
              echo "error: unexpected notarization status '$STATUS'"
              exit 1
              ;;
          esac

          echo "finished=$FINISHED" >> "$GITHUB_OUTPUT"

  gui-smoke:
    needs: build-macos
    if: needs.build-macos.outputs.notarization_finished == 'true'
    uses: ./.github/workflows/gui-smoke-macos.yml
    permissions:
      actions: read
      contents: read
    with:
      artifact_name: breath-ball-macos
      release_tag: ${{ needs.build-macos.outputs.release_tag }}

  finalize-release:
    needs:
      - build-macos
      - gui-smoke
    if: needs.build-macos.outputs.notarization_finished == 'true' && needs.gui-smoke.result == 'success'
    runs-on: macos-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: trigger release finalize
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.build-macos.outputs.release_tag }}"
          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/release-macos-finalize.yml/dispatches" \
            -f ref="$RELEASE_TAG" \
            -f inputs[tag]="$RELEASE_TAG" \
            -f inputs[submission_id]="${{ needs.build-macos.outputs.submission_id }}"
