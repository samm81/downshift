name: release-macos-platform

on:
  workflow_call:
    inputs:
      tag:
        description: release tag to build
        required: true
        type: string
      ref:
        description: git ref to check out
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 75
    environment: release
    env:
      APP_NAME: Downshift
      DOWNSHIFT_ENV: ${{ vars.DOWNSHIFT_ENV }}
      DOWNSHIFT_DOWNLOAD_RELEASE_URL: ${{ vars.DOWNSHIFT_DOWNLOAD_RELEASE_URL }}
      DOWNSHIFT_GITHUB_ISSUES_URL: ${{ vars.DOWNSHIFT_GITHUB_ISSUES_URL }}
      DOWNSHIFT_SUPPORT_EMAIL: ${{ vars.DOWNSHIFT_SUPPORT_EMAIL }}
      DOWNSHIFT_TELEMETRY_ENABLED: ${{ vars.DOWNSHIFT_TELEMETRY_ENABLED }}
      DOWNSHIFT_TELEMETRY_HEARTBEAT_INTERVAL_SEC: ${{ vars.DOWNSHIFT_TELEMETRY_HEARTBEAT_INTERVAL_SEC }}
      DOWNSHIFT_BETTERSTACK_LOGS_TOKEN: ${{ secrets.DOWNSHIFT_BETTERSTACK_LOGS_TOKEN }}
      DOWNSHIFT_BETTERSTACK_LOGS_HOST: ${{ secrets.DOWNSHIFT_BETTERSTACK_LOGS_HOST }}
      DOWNSHIFT_BETTERSTACK_ERRORS_DSN: ${{ secrets.DOWNSHIFT_BETTERSTACK_ERRORS_DSN }}
      DOWNSHIFT_BUILD_CHANNEL: ${{ vars.DOWNSHIFT_BUILD_CHANNEL }}
      MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: verify release tag and checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "error: release tag must match v<major>.<minor>.<patch> with an optional prerelease suffix"
            exit 1
          fi
          CHECKED_OUT_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "$CHECKED_OUT_TAG" != "$RELEASE_TAG" ]; then
            echo "error: checked out '$CHECKED_OUT_TAG' instead of '$RELEASE_TAG'"
            exit 1
          fi

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: install node dependencies
        run: npm ci

      - name: install shell tooling
        run: brew install shellcheck shfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: verify repo
        run: make verify-release

      - name: build signed release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: make release-pre-notarize TAG="$RELEASE_TAG"

      - name: submit notarization
        id: submit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/${APP_NAME}-notarized-${RELEASE_TAG}.dmg"
          SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --output-format json > "$SUBMIT_JSON"

          SUBMISSION_ID="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMIT_JSON")"
          if [ -z "$SUBMISSION_ID" ]; then
            echo "error: failed to read notarization submission id"
            exit 1
          fi
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      - name: wait for notarization
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          STATUS_JSON="$RUNNER_TEMP/notary-status.json"
          SUBMISSION_ID="${{ steps.submit.outputs.submission_id }}"

          set +e
          xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --timeout 45m \
            --output-format json > "$STATUS_JSON"
          WAIT_EXIT=$?
          set -e

          if [ "$WAIT_EXIT" -ne 0 ]; then
            xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --password "$MACOS_NOTARY_APP_PASSWORD" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --output-format json > "$STATUS_JSON"
          fi

          STATUS="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$STATUS_JSON")"
          echo "notarization status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            echo "error: notarization for $RELEASE_TAG did not finish as Accepted"
            exit 1
          fi

      - name: staple and validate release dmg
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          make staple-notarized-dmg TAG="$RELEASE_TAG"
          make verify-notarized-dmg TAG="$RELEASE_TAG"

      - name: collect macOS release artifact
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp "dist/${APP_NAME}-notarized-${RELEASE_TAG}.dmg" release-artifacts/

      - name: upload macOS release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-assets
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  gui-smoke:
    needs: build-macos
    uses: ./.github/workflows/gui-smoke-macos.yml
    permissions:
      actions: read
      contents: read
    with:
      artifact_name: release-macos-assets
      release_tag: ${{ inputs.tag }}
