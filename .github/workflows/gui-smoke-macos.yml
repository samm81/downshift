name: gui-smoke-macos

on:
  workflow_call:
    inputs:
      artifact_name:
        description: workflow artifact name to download and verify instead of a github release asset
        required: false
        type: string
      release_tag:
        description: specific release tag to verify instead of the latest published release
        required: false
        type: string
      screenshot_count:
        description: number of screenshots to capture
        required: false
        default: "4"
        type: string
      screenshot_interval:
        description: seconds between screenshots
        required: false
        default: "0.8"
        type: string
  workflow_dispatch:
    inputs:
      artifact_name:
        description: workflow artifact name to download and verify instead of a github release asset
        required: false
        type: string
      release_tag:
        description: specific release tag to verify instead of the latest published release
        required: false
        type: string
      screenshot_count:
        description: number of screenshots to capture
        required: false
        default: "4"
        type: string
      screenshot_interval:
        description: seconds between screenshots
        required: false
        default: "0.8"
        type: string

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      DOWNSHIFT_RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: download workflow artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifacts

      - name: resolve dmg path from artifact
        if: inputs.artifact_name != ''
        id: artifact
        run: |
          set -euo pipefail
          DMG_PATH="$(find release-artifacts -maxdepth 1 -type f -name 'Downshift-notarized-*.dmg' | head -n 1)"
          if [ -z "$DMG_PATH" ]; then
            echo "error: no notarized dmg found in artifact '${{ inputs.artifact_name }}'"
            exit 1
          fi
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: install image diff tooling
        run: |
          set -euo pipefail
          brew install imagemagick

      - name: launch release candidate app
        id: smoke
        continue-on-error: true
        env:
          DOWNSHIFT_RELEASE_DMG_PATH: ${{ steps.artifact.outputs.dmg_path }}
        run: |
          set -euo pipefail
          ./dev/mac/smoke_gui.bash \
            "${{ inputs.screenshot_count }}" \
            "${{ inputs.screenshot_interval }}"

      - name: summarize smoke result
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## mac gui smoke"
            echo
            if [ -f logs/latest-gui-smoke/result.txt ]; then
              echo '```text'
              cat logs/latest-gui-smoke/result.txt
              echo '```'
            else
              echo "no smoke result artifact was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload gui smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-smoke-macos
          path: |
            logs/latest-gui-smoke
            logs/gui-smoke-*
          if-no-files-found: warn

      - name: fail when smoke verification fails
        if: steps.smoke.outcome != 'success'
        run: |
          echo "error: gui smoke verification failed"
          exit 1
