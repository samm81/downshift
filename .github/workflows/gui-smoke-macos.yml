name: gui-smoke-macos

on:
  workflow_dispatch:
    inputs:
      screenshot_count:
        description: number of screenshots to capture
        required: false
        default: "4"
        type: string
      screenshot_interval:
        description: seconds between screenshots
        required: false
        default: "0.8"
        type: string

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: launch latest released app
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          ./dev/mac/smoke_gui.bash

      - name: capture screenshot 1
        if: steps.smoke.outcome == 'success'
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: shot-1.jpg

      - name: wait before screenshot 2
        if: steps.smoke.outcome == 'success'
        run: sleep ${{ inputs.screenshot_interval }}

      - name: capture screenshot 2
        if: steps.smoke.outcome == 'success'
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: shot-2.jpg

      - name: wait before screenshot 3
        if: steps.smoke.outcome == 'success'
        run: sleep ${{ inputs.screenshot_interval }}

      - name: capture screenshot 3
        if: steps.smoke.outcome == 'success'
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: shot-3.jpg

      - name: wait before screenshot 4
        if: steps.smoke.outcome == 'success'
        run: sleep ${{ inputs.screenshot_interval }}

      - name: capture screenshot 4
        if: steps.smoke.outcome == 'success'
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: shot-4.jpg

      - name: summarize smoke result
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## mac gui smoke"
            echo
            if [ -f logs/latest-gui-smoke/result.txt ]; then
              echo '```text'
              cat logs/latest-gui-smoke/result.txt
              echo '```'
            else
              echo "no smoke result artifact was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload gui smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-macos
          path: |
            logs/latest-gui-smoke
            logs/gui-smoke-*
          if-no-files-found: warn

      - name: fail when smoke verification fails
        if: steps.smoke.outcome != 'success'
        run: |
          echo "error: gui smoke verification failed"
          exit 1
