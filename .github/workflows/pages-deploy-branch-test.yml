name: pages-deploy-branch-test

on:
  push:
    branches:
      - codex/pages-actions-deploy

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    with:
      release_tag: v0.3.0
