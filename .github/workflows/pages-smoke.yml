name: pages-smoke

on:
  push:
    branches:
      - "**"
    paths:
      - "docs/**"
      - "dev/pages/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages-smoke.yml"
      - ".github/workflows/pages-deploy.yml"
  pull_request:
    paths:
      - "docs/**"
      - "dev/pages/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages-smoke.yml"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: stable release tag expected on the deployed site
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: install web tooling
        run: npm ci

      - name: validate release manifest
        run: npm run check:pages

      - name: install Chromium
        run: npx playwright install --with-deps chromium

      - name: run Pages browser smoke
        run: npm run smoke:pages -- dist/pages

      - name: verify deployed Pages manifest
        if: >-
          inputs.release_tag != '' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PAGES_URL: https://getdownshift.app
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if
              curl --fail --location --silent --show-error \
                --retry 3 --retry-delay 5 --retry-all-errors \
                "$PAGES_URL/release.json" \
                --output "$RUNNER_TEMP/deployed-release.json" &&
                curl --fail --location --silent --show-error \
                  --retry 3 --retry-delay 5 --retry-all-errors \
                  "$PAGES_URL/" \
                  --output "$RUNNER_TEMP/deployed-index.html" &&
                node dev/pages/release-manifest.mjs validate \
                  "$RUNNER_TEMP/deployed-release.json" &&
                node dev/pages/release-manifest.mjs validate-embedded \
                  "$RUNNER_TEMP/deployed-release.json" \
                  "$RUNNER_TEMP/deployed-index.html"
            then
              break
            fi

            if [[ "$attempt" == 18 ]]; then
              echo "error: deployed Pages files did not become synchronized"
              exit 1
            fi
            echo "deployed Pages files are not synchronized yet; retrying (${attempt}/18)"
            sleep 10
          done
          if grep -Fq "api.github.com" "$RUNNER_TEMP/deployed-index.html"; then
              echo "error: deployed Pages site still references api.github.com"
              exit 1
          fi
          if [[ -n "$EXPECTED_RELEASE_TAG" ]]; then
            DEPLOYED_VERSION="$(
              node -e \
                'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version)' \
                "$RUNNER_TEMP/deployed-release.json"
            )"
            if [[ "$DEPLOYED_VERSION" != "$EXPECTED_RELEASE_TAG" ]]; then
              echo "error: deployed Pages manifest is $DEPLOYED_VERSION; expected $EXPECTED_RELEASE_TAG"
              exit 1
            fi
            echo "deployed Pages manifest matches $EXPECTED_RELEASE_TAG"
          fi
