[package]
name = "downshift"
version = "0.1.2"
edition = "2021"

[dependencies]
ctrlc = "3.4"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
winit = "0.30"
wry = { version = "0.53", features = ["transparent"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17.1", default-features = false }
