<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f7f9fc;
        color: #18202a;
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        display: grid;
        align-content: center;
        justify-items: stretch;
        padding: 18px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      p {
        margin: 0 0 12px;
      }
      button {
        justify-self: end;
        border: 0;
        border-radius: 8px;
        padding: 7px 14px;
        background: #2f6bdb;
        color: #fff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Anonymous usage data</h1>
    <p>
      We collect basic app usage (first run, session length, menu interactions)
      and anonymous error reports to improve Downshift. No camera/mic. No window
      titles, text, or browsing data.
    </p>
    <button id="ok">OK</button>
    <script>
      (() => {
        const ok = document.getElementById("ok");
        ok.addEventListener("click", () => {
          if (window.ipc && typeof window.ipc.postMessage === "function") {
            window.ipc.postMessage(
              JSON.stringify({ cmd: "close_telemetry_info" }),
            );
          }
        });
      })();
    </script>
  </body>
</html>
